name: empiran
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Networking
  dio: ^5.11.1
  connectivity_plus: ^7.3.1

  # Storage
  path_provider: ^2.1.6
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Database
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.3.6
  path: ^1.9.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.6.0

  # PDF
  pdf: ^3.11.3
  printing: ^5.14.2

  # Media
  image_picker: ^1.1.2
  share_plus: ^11.1.0
  url_launcher: ^6.3.2

  # Charts
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
